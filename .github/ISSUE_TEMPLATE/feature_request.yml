name: Sugestão de recurso
description: Sugira um recurso novo ou uma melhoria para o monolith-nomad
title: "[Recurso]: "
labels: ["enhancement", "needs-discussion"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado pelo interesse em melhorar o monolith-nomad!

        **Atenção:** a implementação de sugestões não é garantida. Cada sugestão é avaliada pelo alinhamento com os objetivos do projeto, pela viabilidade e pelo interesse de quem usa.

        **Antes de enviar:**
        - Procure nas [issues existentes](https://github.com/jhonatanoliveira2/monolith-nomad/issues) para evitar duplicatas
        - Veja se a ideia combina com a proposta do monolith-nomad: conhecimento e educação com foco em uso offline
        - Pense na viabilidade técnica: o monolith-nomad roda em containers e numa grande variedade de hardware, então recursos que exigem muitos recursos (fora tarefas que usam GPU) ou configurações complexas no host têm menos chance de ser implementados
        - Pense no escopo: melhorias pequenas e focadas, que podem ser feitas aos poucos, têm mais chance de ser implementadas do que recursos amplos, que exigem muito desenvolvimento ou não têm um caminho claro
        - Se você puder contribuir com código, testes ou documentação, as chances de o recurso ser implementado aumentam bastante

  - type: dropdown
    id: feature-category
    attributes:
      label: Categoria do recurso
      description: A que área o recurso se refere?
      options:
        - Integração de novo serviço/ferramenta
        - Melhoria no Assistente de IA
        - Melhoria na Base de Conhecimento/RAG
        - Gerenciamento de conteúdo (ZIM, mapas, coleções)
        - Downloads e mirrors
        - Melhoria de interface/UX
        - Gerenciamento do sistema
        - Otimização de desempenho
        - Tradução/localização
        - Documentação
        - Segurança
        - Outro
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Que problema este recurso resolve? A sugestão tem a ver com alguma dificuldade?
      placeholder: Acho frustrante quando... / Seria útil se... / Os usuários têm dificuldade com...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Solução proposta
      description: Descreva o recurso ou a melhoria que você gostaria de ver
      placeholder: Adicionar um recurso que... / Mudar o comportamento para... / Integrar com...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas
      description: Você pensou em outras soluções ou contornos?
      placeholder: Já tentei... / Outra abordagem seria... / Um contorno é...

  - type: textarea
    id: use-case
    attributes:
      label: Caso de uso
      description: Descreva uma situação específica em que este recurso seria útil
      placeholder: |
        Como [tipo de usuário], quando eu [faço algo], quero [conseguir algo] para que [benefício].

        Exemplo: como tenho uma GPU dedicada, quero ver na interface se o suporte à GPU está ativo, para otimizar o desempenho e resolver problemas com mais facilidade.

  - type: dropdown
    id: user-type
    attributes:
      label: Quem se beneficiaria deste recurso?
      description: Para que tipo de usuário ele seria mais útil?
      multiple: true
      options:
        - Usuários individuais/domésticos
        - Famílias
        - Professores/educadores
        - Estudantes
        - Sobrevivencialistas/preppers
        - Desenvolvedores/contribuidores
        - Organizações
        - Todos os usuários
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Qual a importância deste recurso para você?
      options:
        - Crítica - impede o meu uso do monolith-nomad
        - Alta - melhoraria muito a minha experiência
        - Média - seria bom ter
        - Baixa - pequena conveniência
    validations:
      required: true

  - type: textarea
    id: implementation-ideas
    attributes:
      label: Ideias de implementação (opcional)
      description: Se você tem sugestões técnicas de como implementar, compartilhe aqui
      placeholder: Isso poderia usar... / Poderia se integrar com... / Uma abordagem possível é...

  - type: textarea
    id: examples
    attributes:
      label: Exemplos ou referências
      description: Existem recursos parecidos em outros aplicativos? Inclua links, capturas de tela ou descrições
      placeholder: Parecido com o que o [nome do app] faz... / Veja este exemplo em [URL]

  - type: dropdown
    id: willing-to-contribute
    attributes:
      label: Você ajudaria a implementar?
      description: Contribuir aumenta a chance de o recurso ser implementado
      options:
        - "Sim - posso escrever o código"
        - "Sim - posso ajudar a testar"
        - "Sim - posso ajudar com a documentação"
        - "Talvez - com orientação"
        - "Não - não tenho conhecimento/tempo"
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Contexto adicional
      description: Qualquer outro contexto, protótipo, diagrama ou informação sobre a sugestão

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist antes de enviar
      description: Confirme os itens abaixo antes de enviar
      options:
        - label: Procurei sugestões existentes que possam ser parecidas
          required: true
        - label: Este recurso combina com a proposta do monolith-nomad de conhecimento e educação com foco em uso offline
          required: true
        - label: Entendo que a implementação de sugestões não é garantida
          required: true
