name: Relato de bug
description: Reporte um bug ou problema no monolith-nomad
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar um bug! Preencha as informações abaixo para ajudar a diagnosticar e corrigir o problema.

        **Antes de enviar:**
        - Procure nas issues existentes para evitar duplicatas
        - Confirme que você está na versão mais recente do monolith-nomad
        - Remova informações pessoais ou sensíveis de logs e configurações
        - Não envie issues sobre rodar o monolith-nomad no Unraid ou em outro NAS: não há planos de dar suporte a essas plataformas
        - Vulnerabilidades de segurança **não** vão aqui: reporte de forma privada, conforme o [SECURITY.md](https://github.com/jhonatanoliveira2/monolith-nomad/blob/main/SECURITY.md)

  - type: dropdown
    id: issue-category
    attributes:
      label: Categoria do problema
      description: A que área o problema se refere?
      options:
        - Instalação/Configuração
        - Assistente de IA (Ollama)
        - Base de Conhecimento/RAG (upload de documentos)
        - Docker/Containers
        - Configuração de GPU (AMD/ROCm ou NVIDIA)
        - Downloads de conteúdo (ZIM, mapas, coleções, mirrors)
        - Gerenciamento de serviços (iniciar/parar/atualizar)
        - Desempenho/recursos do sistema
        - Interface/Frontend
        - Tradução (pt-BR)
        - Outro
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Descrição do bug
      description: Descreva o bug de forma clara e objetiva
      placeholder: O que aconteceu? O que você esperava que acontecesse?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Passos para reproduzir
      description: Como podemos reproduzir o problema?
      placeholder: |
        1. Vá em '...'
        2. Clique em '...'
        3. Veja o erro
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Comportamento esperado
      description: O que você esperava que acontecesse?
      placeholder: Descreva o resultado esperado
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Comportamento atual
      description: O que aconteceu de fato?
      placeholder: Descreva o que ocorreu, incluindo as mensagens de erro
    validations:
      required: true

  - type: input
    id: nomad-version
    attributes:
      label: Versão do monolith-nomad
      description: Qual versão você está usando? (Veja em Configurações > Verificar Atualizações, ou rode `docker ps` e confira a tag da imagem do nomad_admin)
      placeholder: "ex.: 1.36.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Sistema operacional
      description: Em qual sistema o monolith-nomad está rodando?
      options:
        - Ubuntu 26.04 (Resolute Raccoon)
        - Ubuntu 24.04
        - Ubuntu 22.04
        - Ubuntu 20.04
        - Debian 13 (Trixie)
        - Debian 12 (Bookworm)
        - Debian 11 (Bullseye)
        - Outro baseado em Debian
        - Outro (sem suporte oficial)
    validations:
      required: true

  - type: input
    id: docker-version
    attributes:
      label: Versão do Docker
      description: Qual versão do Docker você usa? (`docker --version`)
      placeholder: "ex.: Docker version 24.0.7"

  - type: dropdown
    id: gpu-present
    attributes:
      label: Você tem GPU dedicada?
      options:
        - "Sim"
        - "Não"
        - "Não sei"
    validations:
      required: true

  - type: input
    id: gpu-model
    attributes:
      label: Modelo da GPU (se houver)
      description: Qual é o modelo da sua GPU? (Veja em Configurações > Sistema, ou rode `lspci | grep -iE "vga|3d|display"`, `rocm-smi` numa AMD ou `nvidia-smi` numa NVIDIA)
      placeholder: "ex.: AMD Radeon RX 9060 XT 16 GB"

  - type: textarea
    id: system-specs
    attributes:
      label: Especificações do sistema
      description: Informe as especificações relevantes (CPU, RAM, espaço livre em disco)
      placeholder: |
        CPU:
        RAM:
        Espaço livre em disco:
        GPU (se houver):

  - type: textarea
    id: service-status
    attributes:
      label: Status dos serviços (se relevante)
      description: Se o problema envolve um serviço, qual é o status dos serviços relevantes? (Veja em Configurações > Apps ou rode `docker ps`)
      placeholder: |
        Cole a saída do `docker ps` ou descreva o estado dos serviços na interface

  - type: textarea
    id: logs
    attributes:
      label: Logs relevantes
      description: |
        Inclua os logs ou mensagens de erro relevantes. **Remova informações pessoais ou sensíveis.**

        Comandos úteis para coletar logs:
        - Central de Comando: `docker logs nomad_admin`
        - Ollama: `docker logs nomad_ollama`
        - Qdrant: `docker logs nomad_qdrant`
        - Serviço específico: `docker logs nomad_<nome-do-serviço>`
        - Os logs de todos os containers também aparecem em `http://IP_DO_DISPOSITIVO:9999` (Dozzle)
      placeholder: Cole aqui a saída dos logs
      render: shell

  - type: textarea
    id: browser-console
    attributes:
      label: Erros no console do navegador (se for problema de interface)
      description: Se for um problema na interface, inclua os erros do console de desenvolvedor do navegador (F12)
      placeholder: Cole aqui os erros do console do navegador
      render: javascript

  - type: textarea
    id: screenshots
    attributes:
      label: Capturas de tela
      description: Se ajudar, adicione capturas de tela que expliquem o problema (arraste e solte as imagens aqui)

  - type: textarea
    id: additional-context
    attributes:
      label: Contexto adicional
      description: Qualquer outra informação sobre o problema (configuração de rede, configurações personalizadas, mudanças recentes etc.)

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist antes de enviar
      description: Confirme os itens abaixo antes de enviar
      options:
        - label: Procurei issues existentes que possam ser sobre este bug
          required: true
        - label: Estou na versão mais recente do monolith-nomad (ou informei a minha versão acima)
          required: true
        - label: Removi informações pessoais ou sensíveis dos logs e das capturas de tela
          required: true
        - label: Este problema NÃO está relacionado a rodar o monolith-nomad num sistema sem suporte (não baseado em Debian)
          required: false
